apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: efk
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  source:
    repoURL: 'https://github.com/YOUR_ORG/YOUR_REPO'
    targetRevision: HEAD
    path: 'helm/efk'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
